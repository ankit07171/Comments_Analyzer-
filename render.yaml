services:
  - type: web
    name: comment-intelligence-platform
    runtime: python
    pythonVersion: "3.11"
    buildCommand: "bash build.sh"
    startCommand: "streamlit run dashboard.py --server.port=$PORT --server.address=0.0.0.0 --logger.level=error"
    envVars:
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/.cache/huggingface
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
